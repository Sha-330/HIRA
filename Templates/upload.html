<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload - HIRA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo">
        <h1>File Upload</h1>
        <nav>
            <ul>
                <li><a href="{{ url_for('index') }}">Home</a></li>
                <li><a href="{{ url_for('login') }}">Login</a></li>
                <li><a href="{{ url_for('results') }}">Results</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <form id="uploadForm" method="POST" action="{{ url_for('upload') }}" enctype="multipart/form-data">
            <h2>Upload File</h2>
            <div>
                <label>
                    <input type="radio" name="fileType" value="Blood" required>
                    Blood
                </label>
                <label>
                    <input type="radio" name="fileType" value="X-Ray" required>
                    X-Ray
                </label>
                <label>
                    <input type="radio" name="fileType" value="MRI" required>
                    MRI
                </label>
                <label>
                    <input type="radio" name="fileType" value="CT-Scan" required>
                    CT-Scan
                </label>
            </div>
            <input type="file" id="fileInput" name="file" required>
            <button type="submit">Upload</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2025 HIRA</p>
    </footer>
</body>
</html>
